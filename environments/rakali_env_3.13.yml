name: rakali_env_3.13
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  # core scientific stack
  - numpy
  - scipy
  - matplotlib
  - pytest
  # YAML config loader for python/examples/
  - pyyaml
  # mesh generation (wraps Shewchuk's triangle library)
  - meshpy
  # coastal / geo helpers
  - shapely
  - pyproj
  - pandas
  # NOTE: NetCDF and MPI are intentionally NOT in this env.
  # Rakali (Fortran) links against module-loaded NetCDF/HDF5 built with NVHPC.
  # Mixing conda's netcdf4/mpi4py into the same process as librakali.so causes
  # HDF5 ABI mismatches and MPI symbol clashes. Build NetCDF via spack or by
  # hand and load it via modules; keep this env for Python-side mesh generation
  # and post-processing only.
