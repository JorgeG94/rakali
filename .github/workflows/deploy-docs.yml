# Builds the FORD API docs and publishes them to the `gh-pages-docs`
# branch, which GitHub Pages serves at https://jorgeg94.github.io/rakali/
# (the URL the README links to).
#
# The Sphinx user guide is built separately by Read the Docs from
# `.readthedocs.yaml`; the two sites are independent.

name: Deploy FORD docs

on:
  push:
    branches:
      - main
  workflow_dispatch: # lets you trigger the first build by hand

permissions:
  contents: write # needed to push to the pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install FORD
        run: pip install ford

      - name: Pip install graphviz
        run: pip install graphviz==0.20.1

      - name: Install c++ graphviz backend
        run: sudo apt install graphviz

      - name: Build FORD docs
        run: ford ford.md

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/fpm-ford
          publish_branch: gh-pages-docs
          # Replace the branch with ONE fresh commit per deploy instead of
          # stacking every build on top of the last: each FORD build is about
          # 211 MB of HTML, and 55 stacked deploys had grown the branch to
          # ~341 MB of repo history (versus ~17 MB for all of `main`).
          force_orphan: true
