[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "rakali"
dynamic = ["version"]
description = "Python interface to the Rakali GPU-native shallow water solver"
readme = "python/README.md"
requires-python = ">= 3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Rakali developers" },
]
keywords = [
    "shallow-water",
    "coastal",
    "tides",
    "gpu",
    "fortran",
    "openmp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
    "numpy >= 1.20",
]

[project.optional-dependencies]
analysis = [
    "xarray >= 2022.6",
]
plotting = [
    "matplotlib >= 3.5",
]
progress = [
    "tqdm >= 4.60",
]
# Triangular mesh generation (UnstructuredMesh.rectangle/disk, mesh builder).
mesh = [
    "meshpy",
    "netCDF4",
    "scipy",
    "matplotlib",
]
# YAML run configuration (rakali.yaml_loader).
yaml = [
    "pyyaml >= 5.1",
]
dev = [
    "pytest >= 7",
]
all = [
    "xarray >= 2022.6",
    "matplotlib >= 3.5",
    "tqdm >= 4.60",
    "meshpy",
    "netCDF4",
    "scipy",
    "pyyaml >= 5.1",
]

[project.urls]
Homepage = "https://github.com/JorgeG94/rakali"
Repository = "https://github.com/JorgeG94/rakali"
Documentation = "https://github.com/JorgeG94/rakali/blob/main/docs/codebase/INDEX.md"

# Hatchling build configuration: source the package from python/rakali
# while keeping pyproject.toml at the repo root.  Editable installs
# (`pip install -e .`) work via PEP 660 path-based loaders.

[tool.hatch.version]
path = "python/rakali/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/rakali"]

[tool.hatch.build.targets.sdist]
include = [
    "python/rakali/**",
    "python/README.md",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
