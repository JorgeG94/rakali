domain:
  type: structured
  nx: 500
  ny: 8
  dx: 1.0
  dy: 1.0
  nz: 6
  t_end: 60.0

bathymetry:
  shape: flat
  depth: 5.0              # H0

initial_condition:
  type: solitary
  solitary:
    amplitude: 1.0        # A (m); A/H = 0.20
    x0: 80.0              # initial peak position (m)

physics:
  cfl: 0.35
  manning_n: 0.0

boundary_conditions:
  west: wall
  east: open
  south: wall
  north: wall

mode:
  use_multilayer: false
  use_nonhydrostatic: true
  log_level: warning
  defer_init: true
