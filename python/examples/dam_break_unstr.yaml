domain:
  type: unstructured
  mesh_shape: rectangle
  length: 100.0
  width: 2.0
  n_across: 100
  t_end: 0.1

bathymetry:
  shape: flat
  depth: 0.0

initial_condition:
  type: dam_break
  dam_break:
    geometry: axis
    axis: x
    split_fraction: 0.5
    h_high: 2.0           # h_left
    h_low: 1.0            # h_right

boundary_conditions:
  groups:
    1: wall               # long sides (bottom, top)
    2: open               # short ends (left, right)
