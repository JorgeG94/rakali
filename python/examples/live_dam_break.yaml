domain:
  type: structured
  nx: 200
  ny: 100
  dx: 5.0
  dy: 5.0
  t_end: 6000.0

bathymetry:
  shape: flat
  depth: 5.0

initial_condition:
  type: dam_break
  dam_break:
    geometry: axis
    axis: x
    split_fraction: 0.5
    h_high: 5.0
    h_low: 1.0

physics:
  cfl: 0.45
  manning_n: 0.025

boundary_conditions:
  west: wall
  east: wall
  south: wall
  north: wall

mode:
  use_multilayer: false
  log_level: warning
  defer_init: true
