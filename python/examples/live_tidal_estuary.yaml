domain:
  type: structured
  nx: 200
  ny: 80
  dx: 150.0
  dy: 150.0
  nz: 8
  t_end: 268272.0         # 6 * M2_PERIOD

bathymetry:
  shape: funnel
  land_height: 2.0
  funnel:
    depth_head: 5.0
    depth_mouth: 22.0
    width_head_cells: 8
    width_mouth_cells: 38

initial_condition:
  type: still

forcing:
  inflow_velocity: 0.4    # river outflow
  inflow_salinity: 0.5    # essentially fresh
  tide:
    amplitude: 1.5
    period: 44712.0       # M2 = 12.42 h

physics:
  cfl: 0.4
  manning_n: 0.022
  smagorinsky_cs: 0.15
  hdiff_kappa: 1.0
  bpg_method: jacobian

boundary_conditions:
  west: inflow
  east: tidal
  south: wall
  north: wall

salinity:
  initial: 35.0

mode:
  use_multilayer: true
  log_level: warning
  defer_init: true
