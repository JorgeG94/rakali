domain:
  type: structured
  nx: 300
  ny: 150
  dx: 2000.0
  dy: 2000.0
  t_end: 86400.0          # 24 h

bathymetry:
  shape: flat
  depth: 200.0

initial_condition:
  type: gaussian_bump
  bump:
    amplitude: 1.0        # m
    x0_fraction: 0.15     # along-coast position as fraction of Lx
    sigma_x: 30000.0      # along-coast width (m)
    decay_from: south     # exponential decay away from this wall (Rossby radius)

forcing:
  coriolis_f: 1.0e-4

physics:
  cfl: 0.4
  manning_n: 0.0
  smagorinsky_cs: 0.05

boundary_conditions:
  west: wall
  east: wall
  south: wall
  north: wall

mode:
  use_multilayer: false
  log_level: warning
  defer_init: true
