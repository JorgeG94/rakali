domain:
  type: structured
  nx: 100
  ny: 50
  dx: 100.0
  dy: 100.0
  nz: 3
  t_end: 17200.0          # ~4.8 h

bathymetry:
  shape: flat
  depth: 10.0
  land_height: 1.5        # west-edge coastline strip
  coastline:
    west_strip_cells: 6
    river_mouth_j_fraction: 0.65
    river_mouth_halfwidth_cells: 5

initial_condition:
  type: still

forcing:
  inflow_velocity: 0.6
  inflow_salinity: 2.0
  coriolis_f: 4.0e-4      # ~5x Earth, for visible rotation

physics:
  cfl: 0.4
  smagorinsky_cs: 0.15
  hdiff_kappa: 2.0
  bpg_method: jacobian

boundary_conditions:
  west: inflow
  east: open
  south: wall
  north: wall

salinity:
  initial: 35.0

mode:
  use_multilayer: true
  log_level: warning
  defer_init: true
