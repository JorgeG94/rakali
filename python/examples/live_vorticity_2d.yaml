domain:
  type: structured
  nx: 240
  ny: 120
  dx: 25.0
  dy: 25.0
  t_end: 21600.0          # 6 h

bathymetry:
  shape: flat
  depth: 10.0
  land_height: 1.0
  island:
    cx_fraction: 0.25
    cy_fraction: 0.5
    radius_cells: 12

initial_condition:
  type: still

forcing:
  inflow_velocity: 0.90
  coriolis_f: 0.0         # f = 0 → pure shear-driven vortex street

physics:
  cfl: 0.4
  smagorinsky_cs: 0.12

boundary_conditions:
  west: inflow
  east: open
  south: wall
  north: wall

mode:
  use_multilayer: false
  log_level: warning
  defer_init: true
