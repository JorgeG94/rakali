domain:
  type: structured
  nx: 200
  ny: 8
  dx: 5.0
  dy: 5.0
  nz: 12
  t_end: 180.0

bathymetry:
  shape: flat
  depth: 20.0

initial_condition:
  type: still             # mass field is uniform; the dam-break is in salinity

physics:
  cfl: 0.4
  manning_n: 0.0
  smagorinsky_cs: 0.15
  hdiff_kappa: 1.0
  bpg_method: jacobian

boundary_conditions:
  west: wall
  east: wall
  south: wall
  north: wall

salinity:
  initial: 33.0           # 0.5 * (s_left + s_right)
  s_left: 36.0            # dense
  s_right: 30.0           # light

mode:
  use_multilayer: true
  log_level: warning
  defer_init: true
