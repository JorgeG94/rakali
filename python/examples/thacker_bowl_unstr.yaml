domain:
  type: unstructured
  mesh_shape: disk
  radius: 5.5             # 1.1 * L
  n_across: 70
  n_boundary: 128
  t_end: null             # script runs to T/2 of linear-theory period

bathymetry:
  shape: bowl
  bowl:
    L: 5.0                # characteristic radius
    h0: 1.0               # depth at centre

initial_condition:
  type: tilted
  tilt:
    z_lake: -0.3          # undisturbed free-surface elevation
    amplitude: 0.1        # initial tilt

boundary_conditions:
  groups:
    1: wall
