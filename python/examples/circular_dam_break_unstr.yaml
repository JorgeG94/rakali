domain:
  type: unstructured
  mesh_shape: disk
  radius: 20.0
  n_across: 80
  n_boundary: 128
  t_end: 1.0

bathymetry:
  shape: flat
  depth: 0.0              # bed at z = 0

initial_condition:
  type: dam_break
  dam_break:
    geometry: radial
    centre: [0.0, 0.0]
    radius: 2.5
    h_high: 2.0           # depth inside the dam
    h_low: 0.5            # depth outside

boundary_conditions:
  groups:
    1: wall
