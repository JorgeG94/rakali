name = "rakali"
version = "0.1.0"
license = "license"
author = "JorgeGV"
maintainer = "jorgegalvez1694@gmail.com"
copyright = "Copyright 2025, JorgeGV"
[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]
# TODO JORGE: fix this
# Match CMake's default (RAKALI_ENABLE_DOUBLE=ON). The C-API mixes
# real(c_double) with real(wp); without DOUBLE_PRECISION wp falls back
# to real32 and the API compile fails with type-mismatch errors.
macros = ["RAKALI_DOUBLE_PRECISION"]
[build]
auto-executables = false
auto-tests = true
auto-examples = false
module-naming = false
[[executable]]
name = "rakali"
source-dir = "app"
main = "main.F90"
[[test]]
name = "rakali_tests"
source-dir = "tests"
main = "tester.F90"
[install]
library = true
test = false
[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"


[dependencies]
pic = { git = "https://github.com/JorgeG94/pic.git", tag = "v0.9.2"}
test-drive = { git = "https://github.com/fortran-lang/test-drive", branch = "main" }
netcdf = "*"
#openmp = "*"
